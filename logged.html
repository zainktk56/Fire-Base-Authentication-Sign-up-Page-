<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Success</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/x-icon" href="https://img.magnific.com/free-vector/red-calligraphy-heart-2_78370-5897.jpg?semt=ais_hybrid&w=740&q=80">
    <link

        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet"
    />
    <style>
        /* ── profile card (matches signup-div style) ── */
        .profile-card {
            width: 100%;
            max-width: 420px;
            background-color: rgba(255, 255, 255, 0);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.548);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin: 0 auto;
            text-align: center;
            font-family: 'Poppins', sans-serif;
        }

        .profile-card h1 {
            color: #fff;
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .profile-card .avatar {
            width: clamp(90px, 25vw, 130px);
            height: clamp(90px, 25vw, 130px);
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.5);
            margin: 0 auto 16px;
            display: block;
            background: rgba(255, 255, 255, 0.1);
        }

        .profile-card .info-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            margin: 14px 0;
            color: #fff;
        }

        .profile-card .info-row h3 {
            font-size: clamp(0.85rem, 2.2vw, 1rem);
            font-weight: 500;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .profile-card .info-row p {
            font-size: clamp(1rem, 2.6vw, 1.3rem);
            font-weight: 500;
            color: #fff;
            word-break: break-word;
            margin: 0;
        }

        .profile-card .info-row p#userEmail {
            font-size: clamp(0.85rem, 2.2vw, 1.1rem);
            opacity: 0.9;
        }

        /* ── logout button (matches #sbtn style) ── */
        .logout-btn {
            width: 100%;
            max-width: 200px;
            padding: 10px;
            height: 46px;
            border-radius: 15px;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: clamp(0.9rem, 2vw, 1rem);
            background-color: #ff4d4d;
            color: #fff;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            margin-top: 16px;
        }

        .logout-btn:hover {
            transform: translate(-0.05em, -0.05em);
            box-shadow: 0.15em 0.15em rgba(0, 0, 0, 0.2);
        }

        .logout-btn:active {
            transform: translate(0.05em, 0.05em);
            box-shadow: 0.05em 0.05em rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 500px) {
            .profile-card {
                padding: 28px 18px;
                border-radius: 12px;
                max-width: 100%;
            }
            .logout-btn {
                max-width: 100%;
            }
        }

        @media (max-width: 380px) {
            .profile-card {
                padding: 22px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <h1>User Profile</h1>

        <img id="userProfile_picture" class="avatar" src="" alt="Profile Picture" />

        <div class="info-row">
            <h3>Username</h3>
            <p id="userName">—</p>
        </div>

        <div class="info-row">
            <h3>Email</h3>
            <p id="userEmail">—</p>
        </div>

        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>

    <!-- ── Firebase modules ── -->
    <script type="module" src="update.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- ── Logout logic (kept separate to avoid interfering with update.js) ── -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCcaHWqG6nDrFTaLcs_pY7Up-nC4CuSo80",
            authDomain: "authentication-d39a0.firebaseapp.com",
            projectId: "authentication-d39a0",
            storageBucket: "authentication-d39a0.firebasestorage.app",
            messagingSenderId: "673460338111",
            appId: "1:673460338111:web:f81f61837e82b50b64750a",
            measurementId: "G-K2FE5XX8VS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById("logoutBtn").addEventListener("click", () => {
            signOut(auth)
                .then(() => {
                    Swal.fire({
                        title: "Logged Out",
                        text: "You have been signed out.",
                        icon: "success",
                        timer: 1500,
                        showConfirmButton: false
                    });
                    setTimeout(() => {
                        window.location.href = "./index.html";
                    }, 1600);
                })
                .catch((error) => {
                    Swal.fire({
                        icon: "error",
                        title: "Logout Failed",
                        text: error.message
                    });
                });
        });
    </script>

</body>
</html>
